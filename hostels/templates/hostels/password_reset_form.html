{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password</title>
<link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
<div class="box">
<h1>Forgot Password</h1>
<p>Type the email you used to register, and we will send you a link to reset your password.</p>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Send Reset Link</button>
</form>
<p><a href="/hostels/login/">Back to Login</a></p>
</div>
</body>
</html>
