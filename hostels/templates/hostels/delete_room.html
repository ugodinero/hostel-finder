{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete Room</title>
<link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
<div class="form-card">
<h1>Delete Room</h1>
<p>Are you sure you want to delete this room?</p>
<p><strong>{{ room.location}}</strong> - {{ room.room_type}} - {{ room.price}}</p>
<p>{{ room.description}}</p>
<form method="post">
{% csrf_token %}
<button type="submit">Delete</button>
</form>
<p><a href="/hostels/my-rooms/">Cancel - Back to My Rooms</a></p>
</div>
</body>
</html>
