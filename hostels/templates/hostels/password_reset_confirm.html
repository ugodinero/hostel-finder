{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password</title>
<link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
<div class="box">
<h1>Set New Password</h1>
{% if validlink %}
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Set New Password</button>
</form>
{% else %}
<p>This reset link is not valid. It may have been used already, or it has expired. Please ask for a new reset link.</p>
<p><a href="{% url 'password_reset' %}">Forgot Password</a></p>
{% endif %}
</div>
</body>
</html>
