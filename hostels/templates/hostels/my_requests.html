{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Requests</title>
<link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
<div class="box">
<h1>Room Requests</h1>
<p><a href="/hostels/my-rooms/">Back to My Rooms</a></p>
{% for r in requests %}
<div class="room">
<p><strong>{{ r.student.user.username }}</strong> wants <strong>{{ r.room.location }}</strong></p>
<p>{{ r.room.room_type }} - {{ r.room.price }}</p>
<p>Student phone: {{ r.student.phone }}</p>
<p>{{ r.date }}</p>
</div>
{% empty %}
<p>No requests yet.</p>
{% endfor %}
</div>
</body>
</html>
